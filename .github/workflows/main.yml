name: Recovery Builder

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Workspace
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev

    - name: Install Repo
      run: |
        mkdir ~/bin
        curl https://googleapis.com > ~/bin/repo
        chmod a+x ~/bin/repo
        export PATH=~/bin:$PATH

    - name: Download Minimal TWRP Source
      run: |
        mkdir twrp && cd twrp
        ~/bin/repo init --depth=1 -u https://github.com -b twrp-11
        ~/bin/repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    - name: Setup Device Tree
      run: |
        mkdir -p twrp/device/generic/mt6877
        cp BoardConfig.mk twrp/device/generic/mt6877/
        cp recovery.fstab twrp/device/generic/mt6877/

    - name: Building Recovery
      run: |
        cd twrp
        export ALLOW_MISSING_DEPENDENCIES=true
        source build/envsetup.sh
        lunch twrp_mt6877-eng || lunch omni_mt6877-eng
        mka recoveryimage
        
